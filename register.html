<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | Smart AI Study Planner</title>

    <link rel="stylesheet" href="./css/register.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="register-container">

<div class="register-box">


<div class="logo">

<h1>🎓 AI Study Planner</h1>

<p>Create your student profile</p>

</div>



<form id="registerForm">



<div class="input-row">


<div class="input-group">

<label>Full Name</label>

<input 
type="text" 
id="name"
name="name"
placeholder="Enter your name"
required>

</div>



<div class="input-group">

<label>Email</label>

<input 
type="email"
id="email"
name="email"
placeholder="Enter email"
required>

</div>


</div>





<div class="input-row">


<div class="input-group">

<label>Mobile Number</label>

<input 
type="tel"
id="phone"
name="phone"
placeholder="Enter mobile number">

</div>




<div class="input-group">

<label>Password</label>

<input 
type="password"
id="password"
name="password"
placeholder="Create password"
required>

</div>


</div>







<div class="input-row">


<div class="input-group">

<label>Course</label>


<select id="course" name="course" required>

<option value="">Select Course</option>

<option>BCA</option>

<option>B.Tech</option>

<option>MCA</option>

<option>Engineering</option>

<option>Other</option>


</select>


</div>





<div class="input-group">


<label>Year</label>


<select id="year" name="year" required>


<option value="">Select Year</option>

<option>First Year</option>

<option>Second Year</option>

<option>Third Year</option>

<option>Final Year</option>


</select>


</div>


</div>








<div class="input-row">


<div class="input-group">


<label>Study Goal</label>


<select id="goal" name="goal" required>


<option value="">Select Goal</option>

<option>Improve Grades</option>

<option>Prepare Exam</option>

<option>Learn New Skills</option>

<option>Competitive Exam</option>


</select>


</div>






<div class="input-group">


<label>Daily Study Hours</label>


<input 
type="number"
id="hours"
name="hours"
placeholder="Example: 3">


</div>


</div>







<div class="input-group">


<label>Subjects</label>


<input 
type="text"
id="subjects"
name="subjects"
placeholder="Enter subjects (Math, Java, DBMS...)">


</div>







<button type="submit">

Create Account 🚀

</button>





<p class="login-link">

Already have an account?

<a href="login.html">Login</a>


</p>



</form>


</div>


</div>





<!-- Firebase Register Script -->

<script type="module" src="./js/register.js"></script>



</body>

</html>
